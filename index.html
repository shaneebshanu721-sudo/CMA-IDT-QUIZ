  const extra=Array.isArray(chapter.additional_mcqs)?chapter.additional_mcqs:[];
  const suggestedSeconds=Math.max(15,Math.min(600,Number(chapter.quiz_timer_seconds)||60));
  const sessionKey=`idt-booster:${chapter.slug}:v3`;
  const validStages=['splash','welcome','sure','option2','option3','quiz','result','more-intro','quiz-more','more-result'];
  const initial=()=>({stage:'splash',questionIndex:0,answers:Array(chapter.mcqs.length).fill(null),moreQuestionIndex:0,moreAnswers:Array(extra.length).fill(null),questionStartedAt:0,moreStartedAt:0,quizStartedAt:0,moreQuizStartedAt:0});
  let state=initial();
  try{
    const saved=JSON.parse(sessionStorage.getItem(sessionKey)||'null');
    if(saved && validStages.includes(saved.stage) && Number.isInteger(saved.questionIndex) && saved.questionIndex>=0 && saved.questionIndex<chapter.mcqs.length && Array.isArray(saved.answers) && saved.answers.length===chapter.mcqs.length && saved.answers.every(v=>v===null||'abcd'.includes(v)&&v.length===1) && Number.isInteger(saved.moreQuestionIndex) && saved.moreQuestionIndex>=0 && saved.moreQuestionIndex<=Math.max(0,extra.length-1) && Array.isArray(saved.moreAnswers) && saved.moreAnswers.length===extra.length){
      state={...initial(),...saved};
    }
  }catch(e){}
  let option3Timer=null,clockInterval=null;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const score=(items,ans)=>ans.filter((a,i)=>a===items[i]?.answer).length;
  const answered=ans=>ans.filter(a=>a!==null).length;
  const save=()=>{try{sessionStorage.setItem(sessionKey,JSON.stringify(state));}catch(e){}};
  const goto=stage=>{state.stage=stage;save();render();};
  const restart=()=>{state=initial();save();render();};
  const logo=chapter.logo || 'assets/akm-logo.png';
  const rewardFor=(s,total)=>{
    const pct=total?((s/total)*100):0;
    const memes=chapter.result_memes||{};
    if(total>0 && s===total)return {src:memes.full||chapter.perfect_score_meme||'', message:'wow, congrats', caption:'wow, congrats'};
    if(pct>=70)return {src:memes.good||'', message:'👏 Great job!', caption:'👏 Great job!'};
    return {src:memes.low||'', message:'പോയി പഠിച്ചിട്ട് വാ....', caption:'പോയി പഠിച്ചിട്ട് വാ....'};
  };
  const rewardFigure=(reward,alt)=>reward&&reward.src?`<figure class="perfect-meme"><img src="${esc(reward.src)}" alt="${esc(alt)}" loading="eager"><figcaption>${esc(reward.caption||'')}</figcaption></figure>`:'';
  const art=(name,type,copy)=>{
    const url=(chapter.images||{})[name];
    const rawHot=(chapter.hotspots||{})[name];
    const hotList=Array.isArray(rawHot)?rawHot:(rawHot?[rawHot]:[]);
    const firstHot=hotList[0]||null;
    const vars=firstHot?`style="--x:${firstHot.left}%;--y:${firstHot.top}%;--w:${firstHot.width}%;--h:${firstHot.height}%;"`:'';
    const fallback=type==='welcome'
      ?`<div class="fallback-art"><div class="speech">CMA INTERMEDIATE · IDT</div><div class="art-main">WELCOME TO THE<br>IDT CONFIDENCE<br>BOOSTER</div><div class="art-secondary">GST INTRODUCTION പഠിച്ചോ?</div><div class="art-doodle" aria-hidden="true">📚⚡</div><div class="art-caption">One chapter. Ten extra challenges. Let's find out!</div><div class="art-button-art" ${vars}>LET'S GO →</div></div>`
      :type==='sure'
      ?`<div class="fallback-art"><div class="speech">A quick confidence check 👀</div><div class="art-doodle" aria-hidden="true">🤨</div><div class="art-main">ഉറപ്പല്ലേ?</div></div>`
      :type==='option3'
      ?`<div class="fallback-art"><div class="art-main">എന്നാ പോയി പഠിച്ചിട്ട് വരു</div><div class="art-doodle" aria-hidden="true">📚</div></div>`
      :`<div class="fallback-art"><div class="speech">Hmm… 😅</div><div class="art-main">ഇത് വല്ലതും നടക്കുവോടേയ്?</div><div class="art-doodle" aria-hidden="true">😂📖</div><div class="art-caption">ശരി, നോക്കാം!</div><div class="art-button-art" ${vars}>OKAY, LET'S GO →</div></div>`;
    const classes=type==='welcome'?'art-frame welcome-art':type==='sure'?'art-frame sure-art':'art-frame option-art';
    const buttons=hotList.map((hot,idx)=>`<button class="art-hotspot" type="button" style="--x:${hot.left}%;--y:${hot.top}%;--w:${hot.width}%;--h:${hot.height}%;" data-action="${esc(hot.action||'')}" aria-label="${esc(hot.label||`Hotspot ${idx+1}`)}"></button>`).join('');
    return `<div class="${classes}" data-art="${esc(name)}">${url?`<img class="art-image" src="${esc(url)}" alt="${esc(copy)}" loading="eager" decoding="async">`:''}${fallback}${buttons}</div>`;
  };
  const quizIntro=()=>`<span class="eyebrow">🧠 BEYOND THE BOX</span><div class="small-head" style="margin-top:12px">EXTRA EXAM KNOWLEDGE</div><p class="subtitle">These questions test additional exam-oriented knowledge related to GST.<br>Don't panic if you get some wrong.</p>`;
  const clockText=seconds=>`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
  const isMore=()=>state.stage==='quiz-more';
  const currentKeys=()=>isMore()?{items:extra,answers:state.moreAnswers,index:'moreQuestionIndex',roundStarted:'moreQuizStartedAt'}:{items:chapter.mcqs,answers:state.answers,index:'questionIndex',roundStarted:'quizStartedAt'};
  const remaining=(start,duration,now=Date.now())=>Math.max(0,Math.ceil(duration-(now-start)/1000));
  function finishQuestion(){
    if(!['quiz','quiz-more'].includes(state.stage))return;
    const keys=currentKeys();
    if(state[keys.index]<keys.items.length-1){
      state[keys.index]++;
      save();render();
    }else goto(state.stage==='quiz'?'result':'more-result');
  }
  function updateClock(){
    if(!['quiz','quiz-more'].includes(state.stage))return;
    const keys=currentKeys();
    const now=Date.now();
    const total=keys.items.length*suggestedSeconds;
    const roundSeconds=remaining(state[keys.roundStarted],total,now);
    if(roundSeconds===0){goto(state.stage==='quiz'?'result':'more-result');return;}
    const roundBox=app.querySelector('[data-total-timer]');
    if(!roundBox)return;
    roundBox.querySelector('[data-total-digits]').textContent=clockText(roundSeconds);
    roundBox.classList.toggle('is-over',roundSeconds<=60);
  }
  function quizMarkup(second){
    const items=second?extra:chapter.mcqs;
    const answers=second?state.moreAnswers:state.answers;
    const i=second?state.moreQuestionIndex:state.questionIndex;
    const q=items[i];
    if(!q)return `<section class="stage card"><h1>More MCQs are coming soon.</h1><button class="secondary" data-action="back-result">BACK TO RESULT</button></section>`;
    const picked=answers[i],locked=picked!==null;
    const currentScore=score(items,answers);
    const label=second?'MORE MCQs':'BEYOND THE BOX';
    return `<section class="stage card"><div class="quiz-top"><span class="quiz-count">QUESTION ${i+1} / ${items.length}</span><span class="score-chip">⭐ ${currentScore} / ${items.length}</span><div class="timer-box total-timer" data-total-timer role="timer" aria-label="Total quiz time remaining"><strong data-total-digits>${clockText(items.length*suggestedSeconds)}</strong><span>⌛ TOTAL TIME</span></div></div><div class="progress" role="progressbar" aria-label="Questions reached" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${i+1}"><span style="width:${(i+1)/items.length*100}%"></span></div><p class="timer-help">You have ${items.length} minutes total for ${items.length} questions. The countdown runs continuously from the start. When 10 minutes are over, the quiz is automatically submitted and remaining unanswered questions get 0 marks.</p>${i===0&&!second?quizIntro():`<span class="eyebrow">🧠 ${label}</span><p class="small-head" style="margin-top:13px">${second?'ADDITIONAL MCQ CHALLENGE':'EXTRA EXAM KNOWLEDGE'}</p>`}<h1 class="question-title">${esc(q.question)}</h1><div class="answers" role="group" aria-label="Choose one answer">${q.options.map((o,j)=>{const letter='abcd'[j];const mode=locked?(letter===q.answer?' correct':letter===picked?' incorrect':''):'';return `<button type="button" class="answer${mode}" data-answer="${letter}" ${locked?'disabled':''} aria-pressed="${picked===letter?'true':'false'}"><span class="letter">${letter.toUpperCase()}</span><span>${esc(o)}</span></button>`;}).join('')}</div>${locked?`<aside class="feedback ${picked===q.answer?'':'wrong'}" role="status"><h3>${picked===q.answer?'🟢 CORRECT! 🔥':'🔴 OOPS! 😂'}</h3><p>${picked===q.answer?'Okay okay... someone actually studied. 👀':'GST Inspector has entered the chat. 👮‍♂️'}</p>${picked===q.answer?'':`<p><strong>Correct Answer: ${esc(q.answer.toUpperCase())}</strong></p>`}<div class="reason"><strong>REASON</strong>${esc(q.reason)}</div></aside><button class="primary next-button" type="button" data-action="next">${i===items.length-1?'SEE MY RESULT →':'NEXT →'}</button>`:''}</section>`;
  }
  function render(){
    if(clockInterval){clearInterval(clockInterval);clockInterval=null;}
    const stage=state.stage;
    document.body.classList.toggle('meme-mode',['welcome','sure','option2','option3'].includes(stage));
    let markup='';
    if(stage==='splash')markup=`<section class="stage splash" aria-label="AKM IDT Confidence Booster opening screen"><div class="splash-card"><span class="splash-badge">✦ CMA INTERMEDIATE ✦</span><img class="splash-logo" src="${esc(logo)}" alt="AKM logo"><h1>IDT CONFIDENCE<br><span>BOOSTER ⚡</span></h1><p class="splash-chapter">CHAPTER 1 · GST INTRODUCTION</p><p class="splash-tagline">Study. Test. Discover. Improve.</p><button class="primary" type="button" data-action="start-booster">START THE BOOSTER <span aria-hidden="true">→</span></button></div></section>`;
    if(stage==='welcome')markup=`<section class="stage" aria-label="Welcome">${art('welcome','welcome','WELCOME TO THE IDT CONFIDENCE BOOSTER — GST INTRODUCTION പഠിച്ചോ? LET’S GO')}</section>`;
    if(stage==='sure')markup=`<section class="stage" aria-label="Confidence check">${art('sure','sure','ഉറപ്പല്ലേ? with three coloured answer pills')}</section>`;
    if(stage==='option2')markup=`<section class="stage" aria-label="Option two reaction">${art('option2','option2','ഇത് വല്ലതും നടക്കുവോടേയ്? OKAY, LET’S GO')}</section>`;
    if(stage==='option3')markup=`<section class="stage" aria-label="Option three reaction">${art('option3','option3','എന്നാ പോയി പഠിച്ചിട്ട് വരു')}</section>`;
    if(stage==='quiz'||stage==='quiz-more'){
      const keys=currentKeys();if(!state[keys.roundStarted])state[keys.roundStarted]=Date.now();save();
      markup=quizMarkup(stage==='quiz-more');
    }
    if(stage==='result'){
      const s=score(chapter.mcqs,state.answers),total=chapter.mcqs.length,unanswered=total-answered(state.answers),wrong=answered(state.answers)-s;
      const reward=rewardFor(s,total);
      markup=`<section class="stage card"><div class="result-top"><span class="eyebrow">🎯 BEYOND THE BOX RESULT</span><div class="result-number">${s}<small> / ${total}</small></div><div class="result-message">${esc(reward.message)}</div>${rewardFigure(reward,'Result reaction meme')}</div><div class="disclaimer">This score reflects your performance in the extra exam knowledge section. It is not your complete Chapter 1 mastery score.</div><div class="stats"><div class="stat"><strong>${s}</strong><span>✅ CORRECT ANSWERS</span></div><div class="stat"><strong>${wrong}</strong><span>📖 WRONG ANSWERS</span></div><div class="stat"><strong>${unanswered}</strong><span>⏱️ UNANSWERED</span></div></div><div class="xray"><h2>🔎 YOUR GST X-RAY</h2><p class="subtitle">One question per topic. Green = answered correctly; red = review this question. These are pointers, not complete mastery ratings.</p><ul class="xray-list">${chapter.mcqs.map((q,i)=>`<li><span>${esc(q.topic)}</span><span class="state ${state.answers[i]===q.answer?'good-text':'bad-text'}">${state.answers[i]===null?'⏱️ Not answered':state.answers[i]===q.answer?'🟢 Correct':'🔴 Review'}</span></li>`).join('')}</ul></div><button class="primary" type="button" data-action="more-mcqs">MORE MCQs →</button></section>`;
    }
    if(stage==='more-intro'){
      const available=extra.length>0;
      markup=`<section class="stage card more-lead"><span class="eyebrow">🧠 ANOTHER MCQ CHALLENGE</span><div class="round-emoji" aria-hidden="true">🔥</div><h1>MORE MCQs<br>COMING UP!</h1><p>${available?`Ready for ${extra.length} additional exam-oriented MCQs?`:'Your next set of MCQs will appear here after the questions are added.'}</p><span class="coming">${available?'ADDITIONAL QUESTION BANK READY':'ADDITIONAL QUESTIONS NOT ADDED YET'}</span>${available?'<button class="primary" data-action="start-more">START MORE MCQs →</button>':''}<button class="secondary" data-action="back-result">← BACK TO YOUR RESULT</button></section>`;
    }
    if(stage==='more-result'){
      const s=score(extra,state.moreAnswers);
      const reward=rewardFor(s,extra.length);
      markup=`<section class="stage card more-lead"><span class="eyebrow">🎯 MORE MCQs RESULT</span><div class="result-number">${s}<small> / ${extra.length}</small></div><div class="result-message">${esc(reward.message)}</div>${extra.length>0?rewardFigure(reward,'More MCQs result reaction meme'):''}<p>This additional MCQ score is shown separately from Beyond the Box. Unanswered questions earn zero marks.</p><button class="primary" data-action="back-result">VIEW FIRST ROUND RESULT →</button><button class="secondary" data-action="restart">↻ RESTART BOOSTER</button></section>`;
    }
    app.innerHTML=markup;
    app.querySelectorAll('.art-image').forEach(img=>{
      const frame=img.closest('.art-frame');const show=()=>frame.classList.add('has-image');
      if(img.complete&&img.naturalWidth>0)show();else img.addEventListener('load',show,{once:true});
      img.addEventListener('error',()=>frame.classList.remove('has-image'),{once:true});
    });
    if(stage==='option3'){
      if(option3Timer)clearTimeout(option3Timer);
      option3Timer=setTimeout(()=>{
        state=initial();save();
        // A tab opened by a QR/normal link is often not closable by script.
        try{window.close();}catch(e){}
        setTimeout(()=>{try{location.replace('about:blank');}catch(e){}},180);
      },3500);
    }else if(option3Timer){clearTimeout(option3Timer);option3Timer=null;}
    if(stage==='quiz'||stage==='quiz-more'){updateClock();if(['quiz','quiz-more'].includes(state.stage))clockInterval=setInterval(updateClock,200);}
    window.scrollTo({top:0,behavior:'instant'});
    app.focus({preventScroll:true});
  }
  app.addEventListener('click',e=>{
    const answer=e.target.closest('[data-answer]');
    if(answer&&['quiz','quiz-more'].includes(state.stage)){
      const keys=currentKeys(),i=state[keys.index];if(keys.answers[i]!==null)return;
      const letter=answer.dataset.answer;if(!'abcd'.includes(letter)||letter.length!==1)return;
      // Reject selections once total time is over.
      if(remaining(state[keys.roundStarted],keys.items.length*suggestedSeconds)===0){updateClock();return;}
      keys.answers[i]=letter;save();render();return;
    }
    const action=e.target.closest('[data-action]')?.dataset.action;
    if(action==='start-booster'&&state.stage==='splash')goto('welcome');
    else if(action==='to-sure'&&state.stage==='welcome')goto('sure');
    else if(action==='to-quiz'&&['sure','option2'].includes(state.stage))goto('quiz');
    else if(action==='to-option2'&&state.stage==='sure')goto('option2');
    else if(action==='to-option3'&&state.stage==='sure')goto('option3');
    else if(action==='next'&&['quiz','quiz-more'].includes(state.stage)){
      const keys=currentKeys();if(keys.answers[state[keys.index]]===null)return;
      if(remaining(state[keys.roundStarted],keys.items.length*suggestedSeconds)===0){updateClock();return;}
      finishQuestion();
    }
    else if(action==='more-mcqs'&&state.stage==='result')goto('more-intro');
    else if(action==='start-more'&&state.stage==='more-intro'&&extra.length>0){if(!state.moreQuizStartedAt)state.moreQuizStartedAt=Date.now();goto('quiz-more');}
    else if(action==='back-result'&&['more-intro','more-result'].includes(state.stage))goto('result');
    else if(action==='restart'&&['more-intro','more-result'].includes(state.stage))restart();
  });
  // Unanswered questions may have been skipped by the timer; preserve their nulls on resume.
  // A timed result may include unanswered questions, so no full-answer requirement.
  if(['quiz-more','more-result'].includes(state.stage)&&extra.length===0)state=initial();
  // Missing answers score zero if the additional MCQ round times out.
  save();render();
})();</script>
</body>
</html>
